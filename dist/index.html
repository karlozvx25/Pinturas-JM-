<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinturas JM · Centro de operación</title><style>
:root{--bg:#f3f5f7;--ink:#18222f;--muted:#75818f;--blue:#2866f6;--line:#e5e9ef}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:var(--blue);color:white;font-weight:600}button:hover{filter:brightness(.94)}button.secondary{background:#edf2fb;color:#285cca}aside{position:fixed;inset:0 auto 0 0;width:232px;background:#101d30;color:#a4b4cb;padding:30px 18px;display:flex;flex-direction:column}.brand{color:white;font-size:24px;font-weight:800;margin:0 10px 35px}.brand span{color:#67a5ff}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#a4b4cb;margin-top:5px}nav button{display:block;width:100%;text-align:left;background:transparent;color:#a4b4cb;margin:5px 0;padding:13px}nav button.active{background:#23416a;color:white}aside footer{margin-top:auto;font-size:12px;line-height:1.8;padding:10px}main{margin-left:232px;padding:0 38px 36px;max-width:1600px}header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:30px}.pill{display:inline-block;padding:6px 10px;border-radius:30px;background:#e8f7ef;color:#23845d;font-size:11px;font-weight:700}.demo{background:#fff2d9;color:#96681c}.eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:700;color:var(--blue);text-transform:uppercase}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}h2{font-size:18px;margin:0 0 18px}p{color:var(--muted);line-height:1.6}.titlebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:23px}.card .value{font-size:30px;font-weight:750;margin:12px 0 5px}.card small{color:var(--muted)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:23px}.panel{margin-bottom:22px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.map{height:290px;position:relative;background:radial-gradient(ellipse at center,#e9f0fd,transparent 70%),repeating-linear-gradient(35deg,transparent,transparent 35px,#eef1f5 36px,transparent 37px);border-radius:10px;overflow:hidden}.hub{position:absolute;left:43%;top:42%;background:#2866f6;color:white;padding:18px;border-radius:14px;box-shadow:0 8px 25px #2866f650}.node{position:absolute;background:white;border:1px solid #d4dfef;box-shadow:0 3px 10px #1231;padding:7px 10px;border-radius:8px;font-size:11px}.map svg{position:absolute;width:100%;height:100%}.legend{font-size:11px;color:var(--muted);margin-top:12px}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:500;padding:13px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #f0f2f5}tr:last-child td{border:0}.badge{border-radius:6px;padding:5px 8px;font-size:11px;background:#edf2ff;color:#4263a5}.warn{background:#fff0db;color:#b07821}.ok{background:#e5f5ed;color:#228060}.notice{padding:13px 16px;background:#eef3fd;color:#486080;border-radius:10px;font-size:12px;line-height:1.6;margin:15px 0}.activity{padding:15px 0;border-bottom:1px solid var(--line)}.activity b{display:block;margin-bottom:6px}.activity small{color:var(--muted)}.swatch{width:30px;height:30px;border-radius:8px;display:inline-block;vertical-align:middle;margin-right:8px}.filters{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}input,select,textarea{border:1px solid #dce2eb;padding:11px;border-radius:8px;background:white;color:var(--ink)}textarea{width:100%;min-height:100px}label{display:block;font-size:12px;color:var(--muted);margin:15px 0 7px}.formula{height:150px;border-radius:12px;background:linear-gradient(135deg,#273f77,#668ac0 50%,#25385b);display:flex;align-items:end;padding:18px;color:white;font-size:22px;font-weight:700}.steps{display:flex;gap:6px;margin:16px 0}.steps span{height:6px;flex:1;background:#e7ebf1;border-radius:4px}.steps .done{background:#2866f6}.toast{position:fixed;bottom:25px;right:25px;background:#10243d;color:white;padding:16px 22px;border-radius:12px;box-shadow:0 10px 40px #0003;z-index:5}details{margin:18px 0}summary{cursor:pointer;font-weight:600}.empty{padding:30px;color:var(--muted)}@media(max-width:950px){aside{width:185px}main{margin-left:185px;padding:0 20px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:620px){aside{position:static;width:auto;padding:16px}.brand{margin:0 0 12px}nav{display:flex;overflow:auto}nav button{min-width:145px}aside footer{display:none}main{margin:0;padding:0 14px}header{height:65px}.titlebar{display:block}.cards{gap:8px}.card{padding:15px}.panel{overflow:auto}h1{font-size:27px}}
</style><link rel="stylesheet" href="atelier.css"><link rel="stylesheet" href="operations.css"><link rel="stylesheet" href="store.css"><aside><div class="brand">JM<span>●</span><small>PINTURAS · OPERACIONES</small></div><nav id="nav"></nav><footer><b style="color:white">SyborX</b><br>Estrategia + tecnología<br><span class="pill demo">PROTOTIPO INTERACTIVO</span></footer></aside><main><header><span>Centro de distribución <span style="color:#a3adba"> / Operación nacional</span></span><span class="pill demo">Datos de demostración</span></header><div id="app"></div></main><div id="toast" hidden class="toast" role="status"></div><script>
const branches=Array.from({length:11},(_,i)=>'Sucursal '+String(i+1).padStart(2,'0'));const families=['Sólida','Metálica','Perlada'];const products=families.flatMap((family,f)=>Array.from({length:30},(_,i)=>({code:['SOL','MET','PER'][f]+'-'+String(i+1).padStart(3,'0'),name:(i===0?['Blanco base','Azul acero','Blanco perla'][f]:'Base '+String(i+1).padStart(2,'0')),family,color:['#ecebe6','#3e5f90','#d7cbbb'][f]})));
const seed=()=>({stock:Array.from({length:12},(_,b)=>products.map((_,i)=>b===0?850+(i%9)*70:((i*7+b*13)%100)+10)),transfers:[],tickets:[{id:'CC-001',who:'Sucursal 03',subject:'Igualación para taller de flotillas',status:'Abierto'}]});let state;try{state=JSON.parse(localStorage.getItem('jm-demo-v1'))||seed()}catch{state=seed()}let page='overview',locationId=1,search='',family='',selected='MET-001';const save=()=>localStorage.setItem('jm-demo-v1',JSON.stringify(state));const tell=s=>{const t=document.querySelector('#toast');t.textContent=s;t.hidden=false;setTimeout(()=>t.hidden=true,3500)};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const navs=[['overview','◫','Vista general'],['inventory','▦','Inventarios'],['logistics','⇄','Distribución'],['lab','◉','Laboratorio de color'],['contact','☏','Contact center'],['demo','▷','Guion de demo']];const total=()=>state.stock.flat().reduce((a,b)=>a+b,0);const low=()=>state.stock.slice(1).flat().filter(x=>x<30).length;const title=(k,h,p,btn='')=>`<div class="titlebar"><div><div class="eyebrow">${k}</div><h1>${h}</h1><p>${p}</p></div>${btn}</div>`;const badge=(s,c='')=>`<span class="badge ${c}">${s}</span>`;
function render(){document.querySelector('#nav').innerHTML=navs.map(([id,icon,label])=>`<button data-nav="${id}" class="${page===id?'active':''}">${icon} &nbsp; ${label}</button>`).join('');document.querySelector('#app').innerHTML=views[page]();bind()}
const views={overview:()=>title('CONTROL EN TIEMPO DEMO','Toda tu operación. Un solo lugar.','Visibilidad desde el almacén central hasta la última entrega.',`<button data-nav="inventory">Revisar inventarios ↗</button>`)+`<div class="cards">${[['Red comercial','11 + 1','Sucursales y centro de distribución'],['Existencias',total().toLocaleString('es-MX'),'Gramos de bases · datos ficticios'],['Por reabastecer',low(),'Combinaciones sucursal / base < 30 g'],['Transferencias',state.transfers.length,'Órdenes generadas en esta demo']].map(x=>`<div class="card"><small>${x[0]}</small><div class="value">${x[1]}</div><small>${x[2]}</small></div>`).join('')}</div><div class="grid"><section class="panel"><div class="row"><h2>Una red conectada</h2><span class="pill">12 ubicaciones</span></div><div class="map"><svg viewBox="0 0 600 290">${branches.map((_,i)=>{let a=i*2*Math.PI/11;return `<line x1="300" y1="145" x2="${300+230*Math.cos(a)}" y2="${145+115*Math.sin(a)}" stroke="#b7cbeb" stroke-dasharray="5 5"/>`}).join('')}</svg><div class="hub">▦ CEDIS</div>${branches.map((b,i)=>{let a=i*2*Math.PI/11;return `<div class="node" style="left:${45+38*Math.cos(a)}%;top:${45+36*Math.sin(a)}%">${b}</div>`}).join('')}</div><div class="legend">Esquema conceptual de la red · ubicaciones sin georreferenciación</div></section><section class="panel"><h2>Prioridades de hoy</h2><div class="activity"><b>◉ Anticipar faltantes</b><small>Política demo: mínimo 30 g, objetivo 80 g.</small></div><div class="activity"><b>⇄ Controlar cada movimiento</b><small>Reservado → en tránsito → recibido.</small></div><div class="activity"><b>◈ Repetir el color correcto</b><small>Fórmula, versión, pigmento y lote en una ficha.</small></div><div class="notice">Todos los indicadores provienen del escenario ficticio. Sin conexión a operaciones reales.</div></section></div>`,
inventory:()=>title('DISPONIBILIDAD','Inventario que se anticipa','90 bases de ejemplo: 30 por familia. Unidad homogénea de demo: gramos.',`<button id="auto">Generar reabastecimiento</button>`)+`<section class="panel"><div class="filters"><select id="location">${['CEDIS',...branches].map((b,i)=>`<option value="${i}" ${i==locationId?'selected':''}>${b}</option>`).join('')}</select><input id="search" placeholder="Buscar código o base" value="${esc(search)}"><select id="family"><option value="">Todas las familias</option>${families.map(f=>`<option ${f===family?'selected':''}>${f}</option>`).join('')}</select></div><table><thead><tr><th>Código / base</th><th>Familia</th><th>Físico</th><th>Reservado</th><th>Disponible</th><th>Estado</th></tr></thead><tbody>${products.map((p,i)=>({...p,i})).filter(p=>(!family||p.family===family)&&(p.code+' '+p.name).toLowerCase().includes(search.toLowerCase())).map(p=>{let physical=state.stock[locationId][p.i],reserved=locationId===0?state.transfers.filter(t=>t.product===p.i&&t.status===0).reduce((s,t)=>s+t.qty,0):0;return `<tr><td><span class="swatch" style="background:${p.color}"></span><b>${p.code}</b> · ${p.name}</td><td>${p.family}</td><td>${physical} g</td><td>${reserved} g</td><td>${physical-reserved} g</td><td>${badge(physical<30?'Bajo mínimo':'Disponible',physical<30?'warn':'ok')}</td></tr>`}).join('')}</tbody></table></section><div class="notice">El reabastecimiento examina las 11 sucursales, reserva disponibilidad del CEDIS y evita duplicar órdenes abiertas. Las políticas por demanda, tiempos de entrega, presentaciones y permisos se definirán con Pinturas JM.</div>`,
logistics:()=>title('TRAZABILIDAD','Cada entrega tiene una historia','La salida descuenta CEDIS; la recepción incrementa la sucursal.')+`<section class="panel"><h2>Transferencia manual</h2><div class="filters"><select id="dest">${branches.map((b,i)=>`<option value="${i+1}">${b}</option>`).join('')}</select><select id="prod">${products.map((p,i)=>`<option value="${i}">${p.code} · ${p.family}</option>`).join('')}</select><input id="qty" type="number" min="1" value="50" aria-label="Cantidad en gramos"><button id="create">Reservar transferencia</button></div></section><section class="panel"><h2>Órdenes de distribución · ${state.transfers.length}</h2>${state.transfers.length?state.transfers.slice().reverse().map(t=>`<div class="activity"><div class="row"><b>${t.id} · ${branches[t.dest-1]}</b>${badge(['Reservado','En tránsito','Recibido'][t.status],t.status===2?'ok':'')}</div><p>${products[t.product].code} · ${t.qty} g · Lote demo L-26-${t.product+1}</p><div class="steps">${[0,1,2].map(x=>`<span class="${x<=t.status?'done':''}"></span>`).join('')}</div><small>${t.events.map(esc).join(' → ')}</small>${t.status<2?`<div style="margin-top:12px"><button data-move="${t.id}">${t.status===0?'Confirmar salida':'Confirmar recepción'}</button></div>`:''}</div>`).join(''):'<div class="empty">Crea una transferencia o genera reabastecimiento desde Inventarios.</div>'}</section>`,
lab:()=>title('PRECISIÓN + CONSISTENCIA','Laboratorio de color','Explora familias, escala fórmulas y simula una orden de dosificación.')+`<div class="grid"><section class="panel"><h2>Ficha de formulación · versión demo 1</h2><label>Referencia de catálogo</label><select id="formulaSelect">${products.map(p=>`<option value="${p.code}" ${p.code===selected?'selected':''}>${p.code} · ${p.name} · ${p.family}</option>`).join('')}</select><label>Peso total de mezcla (g)</label><input id="mass" type="number" min="1" max="100000" value="1000"><label>Sistema / sustrato</label><p>Sistema DEMO-A · panel de prueba automotriz · validación física pendiente</p><table><thead><tr><th>Componente ilustrativo</th><th>Proporción</th><th>Gramos</th><th>Lote demo</th></tr></thead><tbody id="recipe"></tbody></table><div class="notice">Fórmula ficticia, no apta para producción. No representa una receta de fabricante. Requiere pigmentos compatibles, lotes verificados, calibración y aprobación de una probeta física.</div></section><section class="panel"><div class="formula" id="colorPreview">${selected}</div><p>Referencia visual RGB; no predice la apariencia física, efectos metálicos/perlados ni la coincidencia bajo distintas luces.</p><h2>Puente de dosificación</h2>${badge('SIMULACIÓN · hardware sin verificar','warn')}<p>Marca, modelo, software, protocolo, unidades, calibración y mecanismo de confirmación: pendientes de levantamiento técnico.</p><button id="dose">Simular dosificación</button><div id="doseResult" class="notice" hidden></div><details><summary>Qué determina el color físico</summary><p>Tipo y concentración de pigmentos, densidad, lote, sistema colorimétrico, sustrato, aplicación, orientación de partículas y condiciones de iluminación. RGB describe luz de pantalla; la fórmula usa masa o volumen. Para convertir g a mL se necesita la densidad verificada de cada componente.</p></details></section></div>`,
contact:()=>title('ATENCIÓN CON CONTEXTO','Una conversación. Toda la información.','Mesa de atención para sucursales y clientes clave. Sin envíos externos.')+`<div class="grid"><section class="panel"><h2>Registrar solicitud</h2><label>Origen</label><select id="who">${[...branches,'Cliente clave · Taller demo'].map(b=>`<option>${b}</option>`).join('')}</select><label>Solicitud</label><textarea id="subject" placeholder="Describe la necesidad de inventario, entrega o igualación…"></textarea><button id="ticket" style="margin-top:15px">Crear caso</button></section><section class="panel"><h2>Casos de atención</h2>${state.tickets.map((t,i)=>`<div class="activity"><div class="row"><b>${t.id} · ${esc(t.who)}</b>${badge(t.status,t.status==='Resuelto'?'ok':'warn')}</div><p>${esc(t.subject)}</p>${t.status!=='Resuelto'?`<button class="secondary" data-close="${i}">Marcar resuelto</button>`:''}</div>`).join('')}</section></div>`,
demo:()=>title('PRESENTACIÓN · 16 OCTUBRE 2026','Del problema a una operación conectada','Guion de 8–10 minutos para el dueño y el gerente general.')+`<section class="panel">${[['01 · La promesa | 1 min','“Conectemos sus 11 sucursales y el CEDIS en una sola vista.” Abre Vista general y explica que los datos son ficticios.'],['02 · Anticipar la demanda | 2 min','En Inventarios, consulta una sucursal y filtra por familia. Genera reabastecimiento: el sistema propone el faltante hasta 80 g cuando la base está por debajo de 30 g y reserva en CEDIS.'],['03 · Cerrar el ciclo | 2 min','En Distribución, confirma salida y recepción de una orden. Muestra la trazabilidad y verifica cómo cambia el inventario de origen y destino.'],['04 · El color como conocimiento | 2 min','En Laboratorio, elige una base y cambia el peso de 1,000 a 500 g. Explica RGB frente a pigmentos físicos. Simula una dosificación dejando clara la ausencia de conexión a máquinas.'],['05 · Atender con contexto | 1 min','Crea un caso de sucursal o cliente clave y resuélvelo. Conversa sobre vincular casos con órdenes y fórmulas en la implementación.'],['06 · Construir juntos | 1–2 min','Pide que prioricen módulos que ya funcionan, fallas actuales y decisiones clave. Acuerda levantar datos, roles, infraestructura y hardware. La cotización se prepara después de validar alcance y prototipo.']].map(([h,p])=>`<div class="activity"><h2>${h}</h2><p>${p}</p></div>`).join('')}<div class="notice"><b>Supuestos pendientes:</b> nombres y ubicaciones de sucursales; 30 bases por cada una de las 3 familias; unidades, presentaciones, mínimos y máximos; fórmulas autorizadas; lotes y caducidades; permisos; migración; continuidad ante fallas; infraestructura y protocolos de máquinas. Este prototipo guarda datos sólo en este navegador, sin servidor empresarial, autenticación ni integración real.</div><button class="secondary" id="reset">Reiniciar escenario de demostración</button></section>`};
function reserve(dest,product,qty){if(!Number.isFinite(qty)||qty<=0||!Number.isInteger(qty))return false;let reserved=state.transfers.filter(t=>t.product===product&&t.status===0).reduce((s,t)=>s+t.qty,0);if(state.stock[0][product]-reserved<qty)return false;state.transfers.push({id:'TR-'+String(state.transfers.length+1).padStart(4,'0'),dest,product,qty,status:0,events:['Reserva demo '+new Date().toLocaleTimeString('es-MX')]});return true}
function recipe(){const mass=Number(document.querySelector('#mass').value);const valid=Number.isFinite(mass)&&mass>0&&mass<=100000;document.querySelector('#recipe').innerHTML=[['Pigmento A',.65],['Pigmento B',.25],['Base de efecto / ajuste',.1]].map(([n,p],i)=>`<tr><td>${n}</td><td>${p*100}%</td><td>${valid?(mass*p).toFixed(2):'—'}</td><td>D-${i+1}-26</td></tr>`).join('');return valid}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()});if(page==='inventory'){document.querySelector('#location').onchange=e=>{locationId=+e.target.value;render()};document.querySelector('#family').onchange=e=>{family=e.target.value;render()};document.querySelector('#search').onchange=e=>{search=e.target.value;render()};document.querySelector('#auto').onclick=()=>{let n=0;for(let d=1;d<12;d++)for(let p=0;p<90;p++)if(state.stock[d][p]<30&&!state.transfers.some(t=>t.dest===d&&t.product===p&&t.status<2)){if(reserve(d,p,80-state.stock[d][p]))n++}save();render();tell(n+' órdenes generadas; disponibilidad reservada en CEDIS') }}if(page==='logistics'){document.querySelector('#create').onclick=()=>{let ok=reserve(+document.querySelector('#dest').value,+document.querySelector('#prod').value,+document.querySelector('#qty').value);if(ok){save();render()}tell(ok?'Transferencia reservada':'Cantidad inválida o disponibilidad insuficiente')};document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const t=state.transfers.find(t=>t.id===b.dataset.move);if(t.status===0){state.stock[0][t.product]-=t.qty;t.status=1;t.events.push('Salida confirmada demo')}else if(t.status===1){state.stock[t.dest][t.product]+=t.qty;t.status=2;t.events.push('Recepción confirmada demo')}save();render();tell('Movimiento registrado')})}if(page==='lab'){recipe();document.querySelector('#mass').oninput=recipe;document.querySelector('#formulaSelect').onchange=e=>{selected=e.target.value;document.querySelector('#colorPreview').textContent=selected;document.querySelector('#doseResult').hidden=true};document.querySelector('#dose').onclick=()=>{if(!recipe())return tell('Introduce un peso mayor a 0 y hasta 100,000 g');const el=document.querySelector('#doseResult');el.hidden=false;el.textContent='Simulación completada: '+selected+' · '+document.querySelector('#mass').value+' g. No se enviaron instrucciones a ningún equipo.'}}if(page==='contact'){document.querySelector('#ticket').onclick=()=>{const text=document.querySelector('#subject').value.trim();if(!text)return tell('Describe la solicitud');state.tickets.push({id:'CC-'+String(state.tickets.length+1).padStart(3,'0'),who:document.querySelector('#who').value,subject:text,status:'Abierto'});save();render();tell('Caso creado en la demo')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{state.tickets[+b.dataset.close].status='Resuelto';save();render()})}if(page==='demo')document.querySelector('#reset').onclick=()=>{state=seed();save();render();tell('Escenario reiniciado')}}render();
</script><script src="atelier.js"></script><script src="operations.js"></script><script src="vendor/JsBarcode.code128.min.js"></script><script src="store.js"></script></html>
